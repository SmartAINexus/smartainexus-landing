[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grantbridge-crawler"
version = "0.1.0"
description = "Policy-gated crawler components for official funding sources."
requires-python = ">=3.11"
dependencies = ["playwright>=1.45,<2", "tzdata>=2025.2"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["src"]

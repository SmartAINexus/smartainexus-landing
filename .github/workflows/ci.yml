name: GrantBridge CI

on:
  push:
    branches:
      - main
      - "develop/**"
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  python:
    name: Backend, crawler, and AI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - run: pip install -e "./crawler[test]"
      - name: Backend tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: pytest -q
      - name: Crawler tests
        working-directory: crawler
        run: pytest -q
      - name: AI safety tests
        env:
          PYTHONPATH: .
        run: pytest ai/tests -q
      - name: Synthetic crawler to backend integration
        env:
          PYTHONPATH: backend
        run: pytest integration_tests -q
